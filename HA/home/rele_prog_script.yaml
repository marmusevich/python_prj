program_ion_cs8_slave_7:
  alias: "ION CS-8: Программирование Slave 7 (Жесткий)"
  description: "Записывает индивидуальные настройки длинного нажатия для реле 7"
  
  variables:
    target_slave: 7

  sequence:
    - action: modbus.write_register
      note: |
        =========================================================================
        СПРАВОЧНИК И ПРАВИЛА НАСТРОЙКИ LONG PRESS ДЛЯ МОДУЛЕЙ ION CS-8
        =========================================================================
        
        1. АДРЕСА РЕГИСТРОВ НАСТРОЙКИ ВХОДОВ (Входные контакты):
          Контакт 1 (DI1) = 0x0311    Контакт 5 (DI5) = 0x0315
          Контакт 2 (DI2) = 0x0312    Контакт 6 (DI6) = 0x0316
          Контакт 3 (DI3) = 0x0313    Контакт 7 (DI7) = 0x0317
          Контакт 4 (DI4) = 0x0314    Контакт 8 (DI8) = 0x0318

        2. СТРУКТУРА КОДИРОВАНИЯ ЗНАЧЕНИЯ (Value = 2 байта):
          [ Старший байт — ДЕЙСТВИЕ ] + [ Младший байт — ВИРТУАЛЬНАЯ ГРУППА ]

           * Варианты ДЕЙСТВИЙ (Старший байт):
            0x00 — Не менять состояние (игнорировать локально, отправить в ХА)
            0x01 — Включить выходы привязанной группы
            0x02 — Выключить выходы привязанной группы
            0x03 — Переключить состояние выходов (Toggle)

           * Варианты ВИРТУАЛЬНЫХ ГРУПП (Младший байт):
            0x05 — Виртуальная группа 1 (Группа А — занята по дефолту)
            0x06 — Виртуальная группа 2 (Группа B — пустая / идеальна для ХА)
            0x07 — Виртуальная группа 3 (Группа C — пустая / идеальна для ХА)
            0x08 — Виртуальная группа 4 (Группа D — пустая / идеальна для ХА)

        3. ПРИМЕРЫ РАСЧЕТА ЗНАЧЕНИЙ:
           * 0x0205 -> Выключить (0x02) Группу 1 (0x05). Погасит реле на модуле.
           * 0x0006 -> Ничего не делать (0x00) на Группе 2 (0x06). Локальные реле
                      молчат, а в ХА прилетает чистый сигнал в регистр 4097.
           * 0x0307 -> Изменить состояние (0x03) на Группе 3 (0x07).

        =========================================================================
        ТЕКУЩИЙ ШАГ: КОНТАКТ 1 (DI1) -> Настройка на значение 0x0205
      data:
        hub: modbus_hub
        slave: "{{ target_slave }}"
        address: 0x0311
        value: 0x0205

    - action: modbus.write_register
      note: "КОНТАКТ 2 (DI2) -> 0x0205: Выключить Группу 1 (Группа А)"
      data:
        hub: modbus_hub
        slave: "{{ target_slave }}"
        address: 0x0312
        value: 0x0205

    - action: modbus.write_register
      note: "КОНТАКТ 3 (DI3) -> 0x0205: Выключить Группу 1 (Группа А)"
      data:
        hub: modbus_hub
        slave: "{{ target_slave }}"
        address: 0x0313
        value: 0x0205

    - action: modbus.write_register
      note: "КОНТАКТ 4 (DI4) -> 0x0006: Отправка в пустую Группу 2 (Реле молчат)"
      data:
        hub: modbus_hub
        slave: "{{ target_slave }}"
        address: 0x0314
        value: 0x0006

    - action: modbus.write_register
      note: "КОНТАКТ 5 (DI5) -> 0x0006: Отправка в пустую Группу 2 (Реле молчат)"
      data:
        hub: modbus_hub
        slave: "{{ target_slave }}"
        address: 0x0315
        value: 0x0006

    - action: modbus.write_register
      note: "КОНТАКТ 6 (DI6) -> 0x0307: Переключить (Toggle) Группу 3"
      data:
        hub: modbus_hub
        slave: "{{ target_slave }}"
        address: 0x0316
        value: 0x0307

    - action: modbus.write_register
      note: "КОНТАКТ 7 (DI7) -> 0x0307: Переключить (Toggle) Группу 3"
      data:
        hub: modbus_hub
        slave: "{{ target_slave }}"
        address: 0x0317
        value: 0x0307

    - action: modbus.write_register
      note: "КОНТАКТ 8 (DI8) -> 0x0208: Выключить Группу 4"
      data:
        hub: modbus_hub
        slave: "{{ target_slave }}"
        address: 0x0318
        value: 0x0208

    - delay: "00:00:00.500"
      note: "Пауза 500мс для завершения трансляций в шине RS-485"

    - action: modbus.write_register
      note: "ПЕРЕЗАГРУЗКА -> 0x00AA: Запись 0x0001 для применения параметров реле"
      data:
        hub: modbus_hub
        slave: "{{ target_slave }}"
        address: 0x00AA
        value: 0x0001







program_ion_kitchen_long_press:
  alias: "ION CS-8: Настройка Long Press — КУХНЯ"
  description: "Записывает настройки 0x0206 для активных контактов кухни (Реле 13 и 17)"
  
  # Объявляем константы адресов реле для кухни
  variables:
    slave_kitchen_main: 13
    slave_kitchen_add: 17

  sequence:
    # =========================================================================
    # ЧАСТЬ 1: НАСТРОЙКА РЕЛЕ 13 (Контакты 1-6 — свет кухни)
    # =========================================================================
    - action: modbus.write_register
      note: |
        =========================================================================
        СПРАВОЧНИК И ПРАВИЛА НАСТРОЙКИ LONG PRESS ДЛЯ МОДУЛЕЙ ION CS-8 (КУХНЯ)
        =========================================================================
        
        1. АДРЕСА РЕГИСТРОВ НАСТРОЙКИ ВХОДОВ (Входные контакты):
           Контакт 1 (DI1) = 0x0311    Контакт 4 (DI4) = 0x0314
           Контакт 2 (DI2) = 0x0312    Контакт 5 (DI5) = 0x0315
           Контакт 3 (DI3) = 0x0313    Контакт 6 (DI6) = 0x0316
           Контакт 7 (DI7) = 0x0317 (на Реле 17)

        2. СТРУКТУРА КОДИРОВАНИЯ ЗНАЧЕНИЯ (Value = 2 байта):
           [ Старший байт — ДЕЙСТВИЕ ] + [ Младший байт — ВИРТУАЛЬНАЯ ГРУППА ]

           * Варианты ДЕЙСТВИЙ (Старший байт):
             0x02 — Выключить выходы привязанной группы

           * Варианты ВИРТУАЛЬНЫХ ГРУПП (Младший байт):
             0x06 — Виртуальная группа 2 (Группа B — пустая / идеальна для ХА)

        3. НАСТРОЙКА ДЛЯ КУХНИ:
           Для всех активных кнопок кухни мы зашиваем код 0x0206. 
           Это значит: Выключить (0x02) Виртуальную группу 2 (0x06). 
           Локальные реле молчат (так как Группа 2 пустая), а ХА ловит лонг-пресс.

        =========================================================================
        ТЕКУЩИЙ ШАГ: МОДУЛЬ 13 -> КОНТАКТ 1 (DI1) -> Значение 0x0206
      data:
        hub: modbus_hub
        slave: "{{ slave_kitchen_main }}"
        address: 0x0311
        value: 0x0206

    - action: modbus.write_register
      note: "МОДУЛЬ 13 -> КОНТАКТ 2 (DI2) -> 0x0206: Выключить Виртуальную группу 2"
      data:
        hub: modbus_hub
        slave: "{{ slave_kitchen_main }}"
        address: 0x0312
        value: 0x0206

    - action: modbus.write_register
      note: "МОДУЛЬ 13 -> КОНТАКТ 3 (DI3) -> 0x0206: Выключить Виртуальную группу 2"
      data:
        hub: modbus_hub
        slave: "{{ slave_kitchen_main }}"
        address: 0x0313
        value: 0x0206

    - action: modbus.write_register
      note: "МОДУЛЬ 13 -> КОНТАКТ 4 (DI4) -> 0x0206: Выключить Виртуальную группу 2"
      data:
        hub: modbus_hub
        slave: "{{ slave_kitchen_main }}"
        address: 0x0314
        value: 0x0206

    - action: modbus.write_register
      note: "МОДУЛЬ 13 -> КОНТАКТ 5 (DI5) -> 0x0206: Выключить Виртуальную группу 2"
      data:
        hub: modbus_hub
        slave: "{{ slave_kitchen_main }}"
        address: 0x0315
        value: 0x0206

    - action: modbus.write_register
      note: "МОДУЛЬ 13 -> КОНТАКТ 6 (DI6) -> 0x0206: Выключить Виртуальную группу 2"
      data:
        hub: modbus_hub
        slave: "{{ slave_kitchen_main }}"
        address: 0x0316
        value: 0x0206

    - delay: "00:00:00.300"
      note: "Короткая пауза перед перезагрузкой Модуля 13"

    - action: modbus.write_register
      note: "МОДУЛЬ 13 -> ПЕРЕЗАГРУЗКА (0x00AA) -> Применение параметров"
      data:
        hub: modbus_hub
        slave: "{{ slave_kitchen_main }}"
        address: 0x00AA
        value: 0x0001

    - delay: "00:00:00.500"
      note: "Пауза между модулями, чтобы не забивать шину"

    # =========================================================================
    # ЧАСТЬ 2: НАСТРОЙКА РЕЛЕ 17 (Только Контакт 7 относится к кухне)
    # =========================================================================
    - action: modbus.write_register
      note: "МОДУЛЬ 17 -> КОНТАКТ 7 (DI7) -> 0x0206: Выключить Виртуальную группу 2"
      data:
        hub: modbus_hub
        slave: "{{ slave_kitchen_add }}"
        address: 0x0317
        value: 0x0206

    - delay: "00:00:00.300"
      note: "Короткая пауза перед перезагрузкой Модуля 17"

    - action: modbus.write_register
      note: "МОДУЛЬ 17 -> ПЕРЕЗАГРУЗКА (0x00AA) -> Применение параметров"
      data:
        hub: modbus_hub
        slave: "{{ slave_kitchen_add }}"
        address: 0x00AA
        value: 0x0001
