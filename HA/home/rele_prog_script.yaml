# Как этим пользоваться:
# 1. Скопируйте этот код в ваш файл scripts.yaml и перезагрузите скрипты в Home Assistant (или полностью перезапустите сервер).
# 2. Перейдите в интерфейсе в Настройки ➔ Автоматизации и сцены ➔ Скрипты.
# 3. Найдите скрипт ION CS-8: Настройка Long Press (Все контакты) и нажмите Запустить.
# 4. Появится всплывающее окно, где вы сможете ввести сначала 7 для вашего тестового реле, а затем поочередно прошить боевые реле 11, 12, 13 и так далее.


program_ion_cs8_long_press:
  alias: "ION CS-8: Настройка Long Press (Все контакты)"
  description: "Записывает настройки длинного нажатия (0x0205) для всех 8 входов и перезагружает модуль"
  
  # Позволяет выбирать Slave ID при запуске скрипта
  fields:
    target_slave:
      name: "Slave ID модуля"
      description: "Modbus адрес реле, которое нужно настроить (например: 7, 11, 12...)"
      required: true
      default: 7
      selector:
        number:
          min: 1
          max: 247

  sequence:
    # =========================================================================
    # КОНТАКТ 1 (Вход DI1)
    # =========================================================================
    # Адрес регистра: 0x0311 (в десятичной системе 785)
    # Значение: 0x0205
    #   -> Старший байт (0x02): Действие "ВЫКЛЮЧИТЬ" (согласно стр. 5 документации)
    #          0x00-нет действий, 0x01включить, 0x02-выключить, 0x03-переключить 
    #   -> Младший байт (0x05): Привязка к "Виртуальной группе 1" (Группа А)
    #          группы с 1 до 4 = 0x05 ... 0x08
    # =========================================================================
    - service: modbus.write_register
      data:
        hub: modbus_hub
        slave: "{{ target_slave }}"
        address: 0x0311
        value: 0x0205

    # КОНТАКТ 2 (Вход DI2) - Регистр 0x0312
    - service: modbus.write_register
      data:
        hub: modbus_hub
        slave: "{{ target_slave }}"
        address: 0x0312
        value: 0x0205

    # КОНТАКТ 3 (Вход DI3) - Регистр 0x0313
    - service: modbus.write_register
      data:
        hub: modbus_hub
        slave: "{{ target_slave }}"
        address: 0x0313
        value: 0x0205

    # КОНТАКТ 4 (Вход DI4) - Регистр 0x0314
    - service: modbus.write_register
      data:
        hub: modbus_hub
        slave: "{{ target_slave }}"
        address: 0x0314
        value: 0x0205

    # КОНТАКТ 5 (Вход DI5) - Регистр 0x0315
    - service: modbus.write_register
      data:
        hub: modbus_hub
        slave: "{{ target_slave }}"
        address: 0x0315
        value: 0x0205

    # КОНТАКТ 6 (Вход DI6) - Регистр 0x0316
    - service: modbus.write_register
      data:
        hub: modbus_hub
        slave: "{{ target_slave }}"
        address: 0x0316
        value: 0x0205

    # КОНТАКТ 7 (Вход DI7) - Регистр 0x0317
    - service: modbus.write_register
      data:
        hub: modbus_hub
        slave: "{{ target_slave }}"
        address: 0x0317
        value: 0x0205

    # КОНТАКТ 8 (Вход DI8) - Регистр 0x0318
    - service: modbus.write_register
      data:
        hub: modbus_hub
        slave: "{{ target_slave }}"
        address: 0x0318
        value: 0x0205

    # Пауза 500мс перед перезагрузкой, чтобы реле успело обработать последний регистр
    - delay: "00:00:00.500"

    # =========================================================================
    # ПЕРЕЗАГРУЗКА МОДУЛЯ
    # =========================================================================
    # Адрес регистра: 0x00AA (в десятичной системе 170) - Перезагрузка
    # Значение: 0x0001 (Запись любого значения вызывает перезагрузку модуля)
    # =========================================================================
    - service: modbus.write_register
      data:
        hub: modbus_hub
        slave: "{{ target_slave }}"
        address: 0x00AA
        value: 0x0001
