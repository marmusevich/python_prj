- id: '1790857068522'
  alias: автоматизация по значению сенсора (Новый синтаксис)
  description: Удержание кнопок 1, 2, 3 или 8
  triggers:
  - trigger: state
    entity_id:
    - sensor.cs8_7_status_register_shifted
    note: Ловим любое изменение регистра статуса кнопок
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.state | int(0) > 0 }}'
    note: Отсекаем событие, когда кнопку отпустили (ноль)
  - condition: template
    value_template: '{{ (trigger.to_state.state | int(0) | bitwise_and(1 + 2 + 4 +
      128)) > 0 }}'
    note: Проверяем маску кнопок 1, 2, 3 и 8 через побитовое И
  actions:
  - action: light.turn_off
    target:
      entity_id:
      - light.rele_1
      - light.rele_2
      - light.rele_3
      - light.rele_8
    note: Выключаем нужный свет
    enabled: true
    data: {}
  - action: persistent_notification.create
    data:
      title: Modbus
      message: "Зафиксировано длинное нажатие в {{ now().strftime('%H:%M:%S')}} \n
        Код сработавшего комбо кнопок: {{ trigger.to_state.state }}"
    - action: system_log.write
      data:
      message: "Зафиксировано длинное нажатие группы кухни в {{ now().strftime('%H:%M:%S')}} \n
        Код сработавшего комбо кнопок: {{ trigger.to_state.state }}"
      level: info
      logger: "automation.floor_heating_protection.stolovaia"
       
  mode: restart
  
  
  
