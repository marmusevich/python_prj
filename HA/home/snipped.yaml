activate_all_modbus_hold_functions:
  alias: "ПРОШИВКА: Включить лонг-пресс на всех реле"
  sequence:
    # Повторяем для каждого Slave ID (11, 12, 13, 14, 15, 16, 17)
    - repeat:
        for_each: [11, 12, 13, 14, 15, 16, 17]
        sequence:
          # Запись правил лонг-пресса для всех 8 входов подряд (регистры 0x0311-0x0318 -> 785-792)
          - service: modbus.write_register
            data:
              hub: modbus_hub
              slave: "{{ repeat.item }}"
              address: 785  # Вход 1
              value: 773    # 0x0305 (Инвертировать вирт.группу 1)
          - service: modbus.write_register
            data:
              hub: modbus_hub
              slave: "{{ repeat.item }}"
              address: 786  # Вход 2
              value: 773
          - service: modbus.write_register
            data:
              hub: modbus_hub
              slave: "{{ repeat.item }}"
              address: 787  # Вход 3
              value: 773
          - service: modbus.write_register
            data:
              hub: modbus_hub
              slave: "{{ repeat.item }}"
              address: 788  # Вход 4
              value: 773
          - service: modbus.write_register
            data:
              hub: modbus_hub
              slave: "{{ repeat.item }}"
              address: 789  # Вход 5
              value: 773
          - service: modbus.write_register
            data:
              hub: modbus_hub
              slave: "{{ repeat.item }}"
              address: 790  # Вход 6
              value: 773
          - service: modbus.write_register
            data:
              hub: modbus_hub
              slave: "{{ repeat.item }}"
              address: 791  # Вход 7 (Кнопка вашей Люстры 1 в гостиной)
              value: 773
          - service: modbus.write_register
            data:
              hub: modbus_hub
              slave: "{{ repeat.item }}"
              address: 792  # Вход 8
              value: 773
          # Программная перезагрузка текущего реле модуля для сохранения настроек
          - service: modbus.write_register
            data:
              hub: modbus_hub
              slave: "{{ repeat.item }}"
              address: 170  # 0x00AA
              value: 1
          # Небольшая пауза, чтобы не перегружать шину RS-485
          - delay: "00:00:01"
        