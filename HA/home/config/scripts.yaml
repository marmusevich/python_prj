set_all_ion_releys_long_press_time:
  alias: "ION CS-8: Установка времени Long Press (Все реле)"
  description: "Устанавливает одинаковое время удержания кнопок для всех модулей от 11 до 17"
  
  # Объявляем константу времени удержания (в миллисекундах)
  variables:
    hold_time_ms: 2500  # ← Поменяйте на 2000, если 2.5 сек покажется слишком много

  sequence:
    - repeat:
        note: |
          =========================================================================
          СПРАВОЧНИК ПО НАСТРОЙКЕ ВРЕМЕНИ УДЕРЖАНИЯ (РЕГИСТР 0x0104 / 260)
          =========================================================================
          
          * Диапазон возможных значений: от 500 до 5000 мс (от 0.5 до 5.0 секунд)
          * Заводское значение по умолчанию: 1500 мс (1.5 секунды)
          * Текущая настройка: зашиваем значение из константы во все модули
          
          =========================================================================
          ПРОЦЕСС: Циклический перебор боевых реле с ID 11 по 17
        for_each:
          - 11
          - 12
          - 13
          - 14
          - 15
          - 16
          - 17
        sequence:
          # Шаг 1: Запись нового времени удержания в регистр 0x0104
          - action: modbus.write_register
            data:
              hub: modbus_hub
              slave: "{{ repeat.item }}"
              address: 0x0104
              value: "{{ hold_time_ms }}"
            note: "Запись таймера во все входы модуля"

          # Шаг 2: Короткая пауза для стабильности шины перед перезагрузкой
          - delay: "00:00:00.200"

          # Шаг 3: Программная перезагрузка текущего модуля для применения настроек
          - action: modbus.write_register
            data:
              hub: modbus_hub
              slave: "{{ repeat.item }}"
              address: 0x00AA
              value: 0x0001
            note: "Перезагрузка модуля для применения параметров"

          # Шаг 4: Пауза между модулями, чтобы они успели загрузиться и не забивали шину
          - delay: "00:00:00.800"
