# /config/packages/curtains/automations/mqtt_running_reset.yaml
automation:
  # ============================================================================
  # ГОСТИНАЯ
  # ============================================================================
  - id: 3100-reset_motion_gostinaya_shtora
    alias: "Reset: Штора (Движение) - сброс при остановке: Гостиная"
    triggers:
      - trigger: mqtt
        topic: "zigbee2mqtt/Гостиная штора"
    conditions:
      - condition: template
        value_template: "{{ trigger.payload_json.running is defined and trigger.payload_json.running == false }}"
    actions:
      - service: mqtt.publish
        data:
          topic: "zigbee2mqtt/Гостиная штора/set"
          payload: "STOP"
          off_delay: 16
    mode: single

