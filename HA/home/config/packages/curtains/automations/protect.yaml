# /config/packages/curtains/automations/protect.yaml
# Защита штор, объединить защищаемые шторы в группы

automation:

  # ==========================================================================
  # КАБИНЕТ: Групповая защита от двери
  # ==========================================================================
  - id: 2000-cover_cabinet_when_door_open
    alias: "Защита: Кабинет - остановить штору при открытии двери"
    triggers:
      - trigger: state
        entity_id: binary_sensor.datchik_dveri_kabinet_3_contact
        from: "off"
        to: "on"
    conditions: []
    actions:
      - action: cover.stop_cover
        target:
          entity_id:
            - cover.kabinet_shtora
            - cover.kabinet_tiul
            - cover.kabinet_sontse_dver
      # Логирование в системный журнал HA
      - action: system_log.write
        data:
          message: "Защита сработала: дверь Кабинета открыта, шторы остановлены"
          level: warning
          logger: "automation.curtain_protection.2000-cover_cabinet_when_door_open"
      # Уведомление в UI (persistent notification) - отключено
      - action: persistent_notification.create
        data:
          title: "Защита штор"
          message: "Дверь Кабинета открыта - шторы остановлены"
          notification_id: "curtain_protection_cabinet"
    mode: single

