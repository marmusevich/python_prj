# /config/packages/curtains/automations/protect.yaml
# Защита штор
# 1. Сработала защита - остановить штору, защита деактивирована - очистить уведомление + залогировать
# 2. Штора начинает ехать и активна защита - остановить

automation:

  # ==========================================================================
  # КАБИНЕТ: Групповая защита от двери
  # ==========================================================================
  - id: 2000-cover_cabinet_when_door_open
    alias: "Защита: Кабинет - остановить штору при открытии двери"
    triggers:
      - trigger: state
        entity_id: binary_sensor.datchik_dveri_kabinet_3_contact
        to: "on"
        id: protection_active
      - trigger: state
        entity_id: binary_sensor.datchik_dveri_kabinet_3_contact
        to: "off"
        id: protection_inactive
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: protection_active
            sequence:
              - action: cover.stop_cover
                target:
                  entity_id:
                    - cover.kabinet_shtora
                    # ОТКЛЮЧЕНО: текстиль не установлен
                    #- cover.kabinet_tiul
                    - cover.kabinet_sontse_dver
              - action: system_log.write
                data:
                  message: "Защита сработала: дверь Кабинета открыта, шторы остановлены"
                  level: warning
                  logger: "automation.curtain_protection.2000-cover_cabinet_when_door_open"
              - action: persistent_notification.create
                data:
                  title: "Защита штор"
                  message: "Дверь Кабинета открыта - шторы остановлены"
                  notification_id: "curtain_protection_cabinet"
          
          - conditions:
              - condition: trigger
                id: protection_inactive
            sequence:
              - action: system_log.write
                data:
                  message: "Защита снята: дверь Кабинета закрыта, уведомления очищены"
                  level: info
                  logger: "automation.curtain_protection.2000-cover_cabinet_when_door_open"
              - action: persistent_notification.dismiss
                data:
                  notification_id: "curtain_protection_cabinet"
              - action: persistent_notification.dismiss
                data:
                  notification_id: "curtain_protection_kabinet_shtora"
              - action: persistent_notification.dismiss
                data:
                  notification_id: "curtain_protection_kabinet_tiul"
              - action: persistent_notification.dismiss
                data:
                  notification_id: "curtain_protection_kabinet_sontse_dver"
    mode: single

