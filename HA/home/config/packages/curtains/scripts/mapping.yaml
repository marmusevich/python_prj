# /config/packages/curtains/scripts/mapping.yaml
# Маппинг скриптов для пультов и сцен
#
# Архитектура:
# - Все циклы используют curtain_cycle_group (универсальный скрипт для групп)
# - Все сцены используют curtain_set_positions (упрощённый, без input_boolean/input_select)
# - Кнопка 4 одинарная: curtain_group_open_or_stop
# - Кнопка 4 двойная: curtain_group_close
#
# Используемые датчики (из кастомного конвертера):
# - binary_sensor.xxx_running: движение (on/off)
# - sensor.xxx_last_direction: последнее направление (opening/closing/stopped)

# ### ШТОРЫ, ЖАЛЮЗИ, ТЮЛЬ (cover)
# | Friendly Name | Entity ID |
# |---|---|
# {% for entity in states.cover | sort(attribute='attributes.friendly_name') %}
# | {{ entity.attributes.friendly_name }} | `{{ entity.entity_id }}` |
# {% endfor %}
# ---
# ### ДАТЧИКИ ДВИЖЕНИЯ (binary_sensor *running)

# | Friendly Name | Entity ID |
# |---|---|
# {% for entity in states.binary_sensor | selectattr('entity_id', 'search', 'running') | sort(attribute='attributes.friendly_name') %}
# | {{ entity.attributes.friendly_name }} | `{{ entity.entity_id }}` |
# {% endfor %}
# ---
# ### НАПРАВЛЕНИЕ (sensor *direction)
# | Friendly Name | Entity ID |
# |---|---|
# {% for entity in states.sensor | selectattr('entity_id', 'search', 'direction') | sort(attribute='attributes.friendly_name') %}
# | {{ entity.attributes.friendly_name }} | `{{ entity.entity_id }}` |
# {% endfor %}
# ### ШТОРЫ, ЖАЛЮЗИ, ТЮЛЬ (cover)
# | Friendly Name | Entity ID |
# | Гостиная Жалюзи (левые) | `cover.gostinaia_zhaliuzi_levo` |
# | Гостиная Жалюзи (правые) | `cover.gostinaia_zhaliuzi_pravo` |
# | Гостиная Жалюзи (центр) | `cover.gostinaia_zhaliuzi_tsentr` |
# | Гостиная Тюль | `cover.gostinaia_tiul` |
# | Гостиная Штора | `cover.gostinaia_shtora` |
# | Гостинная с защиой от открытия вентиляции  лево | `cover.gostinnaia_s_zashchioi_ot_otkrytiia_ventiliatsii_levo` |
# | Гостинная с защиой от открытия вентиляции право | `cover.gostinnaia_s_zashchioi_ot_otkrytiia_ventiliatsii_pravo` |
