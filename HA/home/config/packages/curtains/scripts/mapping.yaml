# /config/packages/curtains/scripts/mapping.yaml
# Маппинг скриптов для пультов и сцен
#
# Архитектура:
# - Все циклы используют curtain_cycle_group (универсальный скрипт для групп)
# - Все сцены используют curtain_set_positions (упрощённый, без input_boolean/input_select)
# - Кнопка 4 одинарная: curtain_group_open_or_stop
# - Кнопка 4 двойная: curtain_group_close
#
# Используемые датчики (из кастомного конвертера):
# - binary_sensor.xxx_running: движение (on/off)
# - sensor.xxx_last_direction: последнее направление (opening/closing/stopped)

script:
  # ============================================================================
  # КУХНЯ
  # ============================================================================

  kitchen_curtain_cycle:
    alias: "штора - цикл: Кухня"
    sequence:
      - service: script.curtain_cycle_group
        data:
          target_covers: [cover.kukhnia_shtora]
          running_sensors: [binary_sensor.kukhnia_shtora_running]
          last_direction_sensors: [sensor.kukhnia_shtora_last_direction]
          protection_sensors: [null]

  kitchen_tulle_cycle:
    alias: "тюль - цикл: Кухня"
    sequence:
      # Отключено по запросу заказчика (текстиль не установлен)
      # - service: script.curtain_cycle_group
      #   data:
      #     target_covers: [cover.kukhnia_tiul]
      #     running_sensors: [binary_sensor.kukhnia_tiul_running]
      #     last_direction_sensors: [sensor.kukhnia_tiul_last_direction]
      #     protection_sensors: [null]
      - service: system_log.write
        data:
          message: "SKIP: kitchen_tulle_cycle - устройство отключено по запросу заказчика (текстиль не установлен)"
          level: warning
          logger: "mapping.kitchen_tulle_cycle"      

  kitchen_blind_cycle:
    alias: "жалюзи - цикл: Кухня"
    sequence:
      - service: script.curtain_cycle_group
        data:
          target_covers: [cover.kukhnia_zhaliuzi]
          running_sensors: [binary_sensor.kukhnia_zhaliuzi_running]
          last_direction_sensors: [sensor.kukhnia_zhaliuzi_last_direction]
          protection_sensors: [null]

  kitchen_scene_1:
    alias: "сцена 1: Кухня"
    sequence:
      - service: script.curtain_set_positions
        data:
          curtains:
            - { cover: cover.kukhnia_shtora, position: 100, protection: null }
            # важно!!!! - включить в защите - там тоже закоментировано
            # ОТКЛЮЧЕНО: текстиль не установлен
            #- { cover: cover.kukhnia_tiul, position: 0, protection: null }
            - { cover: cover.kukhnia_zhaliuzi, position: 0, protection: null }

  kitchen_scene_2:
    alias: "сцена 2: Кухня"
    sequence:
      - service: script.curtain_set_positions
        data:
          curtains:
            - { cover: cover.kukhnia_shtora, position: 100, protection: null }
            # важно!!!! - включить в защите - там тоже закоментировано
            # ОТКЛЮЧЕНО: текстиль не установлен
            #- { cover: cover.kukhnia_tiul, position: 0, protection: null }
            - { cover: cover.kukhnia_zhaliuzi, position: 100, protection: null }

  kitchen_scene_3:
    alias: "сцена 3: Кухня"
    sequence:
      - service: script.curtain_set_positions
        data:
          curtains:
            - { cover: cover.kukhnia_shtora, position: 100, protection: null }
            # важно!!!! - включить в защите - там тоже закоментировано
            # ОТКЛЮЧЕНО: текстиль не установлен
            #- { cover: cover.kukhnia_tiul, position: 100, protection: null }
            - { cover: cover.kukhnia_zhaliuzi, position: 0, protection: null }

  kitchen_all_open_or_stop:
    alias: "всё - открыть или стоп: Кухня"
    sequence:
      - service: script.curtain_group_open_or_stop
        data:
          target_covers:
            - cover.kukhnia_shtora
            # важно!!!! - включить в защите - там тоже закоментировано
            # ОТКЛЮЧЕНО: текстиль не установлен
            #- cover.kukhnia_tiul
            -  cover.kukhnia_zhaliuzi
          running_sensors:
            - binary_sensor.kukhnia_shtora_running
            # важно!!!! - включить в защите - там тоже закоментировано
            # ОТКЛЮЧЕНО: текстиль не установлен
            #- binary_sensor.kukhnia_tiul_running
            - binary_sensor.kukhnia_zhaliuzi_running
          protection_sensors: 
            - null
            # важно!!!! - включить в защите - там тоже закоментировано
            # ОТКЛЮЧЕНО: текстиль не установлен
            #- null
            - null

  kitchen_all_close:
    alias: "всё - закрыть: Кухня"
    sequence:
      - service: script.curtain_group_close
        data:
          target_covers:
            - cover.kukhnia_shtora
            # важно!!!! - включить в защите - там тоже закоментировано
            # ОТКЛЮЧЕНО: текстиль не установлен
            #- cover.kukhnia_tiul
            - cover.kukhnia_zhaliuzi
          protection_sensors: 
            - null
            # важно!!!! - включить в защите - там тоже закоментировано
            # ОТКЛЮЧЕНО: текстиль не установлен
            #- null
            - null

  # ============================================================================
  # МАСТЕР САНУЗЕЛ
  # ============================================================================

  master_bath_curtain_cycle:
    alias: "штора - цикл: Мастер санузел"
    sequence:
      # важно!!!! - включить в защите - там тоже закоментировано
      # мотор обесточен
      # - service: script.curtain_cycle_group
      #   data:
      #     target_covers: [cover.master_sanuzel_shtora]
      #     running_sensors: [binary_sensor.master_sanuzel_shtora_running]
      #     last_direction_sensors: [sensor.master_sanuzel_shtora_last_direction]
      #     protection_sensors: [null]
      - service: system_log.write
        data:
          message: "SKIP: master_bath_curtain_cycle - мотор обесточен"
          level: warning
          logger: "mapping.master_bath_curtain_cycle"

  master_bath_tulle_cycle:
    alias: "тюль - цикл: Мастер санузел"
