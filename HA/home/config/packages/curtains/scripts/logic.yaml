# /config/packages/curtains/scripts/logic.yaml
# Универсальные скрипты управления шторами, жалюзи и тюлем
# 
# Архитектура:
# - curtain_cycle_group: универсальный скрипт цикла для групп устройств (открыть/стоп/закрыть)
# - curtain_set_positions: скрипт для установки конкретных позиций (сцены)
# - curtain_group_open_or_stop: кнопка 4 однократное нажатие (открыть всё ИЛИ стоп)
# - curtain_group_close: кнопка 4 двукратное нажатие (закрыть всё)
#
# Используемые датчики (из кастомного конвертера):
# - binary_sensor.xxx_running: движение (on/off)
# - sensor.xxx_direction: текущее направление (opening/closing/stopped)
# - sensor.xxx_last_direction: последнее направление (opening/closing/stopped)
#
# Обработка unknown:
# - running: unknown → off (стоит)
# - last_direction: unknown → closing (начальное состояние после перезагрузки)

script:
  # ============================================================================
  # УНИВЕРСАЛЬНЫЙ СКРИПТ ЦИКЛА ДЛЯ ГРУПП УСТРОЙСТВ
  # ============================================================================
  
  curtain_cycle_group:
    alias: "(не вызывать) Универсальный скрипт цикла для ГРУППЫ устройств"
    fields:
      target_covers:
        description: "Список cover entity_id"
        required: true
      running_sensors:
        description: "Список binary_sensor xxx_running"
        required: true
      last_direction_sensors:
        description: "Список sensor xxx_last_direction"
        required: true
      protection_sensors:
        description: "Список датчиков защиты (null если нет защиты)"
        required: false
    sequence:
      # ========================================================================
      # ШАГ 1: Нормализация датчиков и чтение состояний
      # ========================================================================
      - variables:
          # Создаём список устройств с нормализованными состояниями
          devices: >-
            {% set ns = namespace(list=[]) %}
            {% for i in range(target_covers | length) %}
              {% set running_raw = states(running_sensors[i]) %}
              {% set running = 'off' if running_raw in ['unknown', 'unavailable', 'off'] else 'on' %}
              
              {% set last_dir_raw = states(last_direction_sensors[i]) %}
              {% set last_dir = 'closing' if last_dir_raw in ['unknown', 'unavailable'] else last_dir_raw %}
              
              {% set pos = state_attr(target_covers[i], 'current_position') | int(50) %}
              
              {% set ns.list = ns.list + [{
                'cover': target_covers[i],
                'running': running,
                'last_direction': last_dir,
                'position': pos,
                'index': i
              }] %}
            {% endfor %}
            {{ ns.list }}
          
          # Нормализуем список защит
          protections: >-
            {% if protection_sensors is defined and protection_sensors is not none %}
              {{ protection_sensors }}
            {% else %}
              {% set ns = namespace(items=[]) %}
              {% for i in range(target_covers | length) %}
                {% set ns.items = ns.items + [none] %}
              {% endfor %}
              {{ ns.items }}
            {% endif %}
          
          # Пороги из input_number
          closed_threshold: "{{ states('input_number.curtain_closed_threshold') | int(5) }}"
          open_threshold: "{{ states('input_number.curtain_open_threshold') | int(95) }}"

      - service: system_log.write
        data:
          message: "STEP 1: Нормализация завершена. Устройств: {{ devices | length }}, пороги: {{ closed_threshold }}/{{ open_threshold }}"
          level: info
          logger: "curtain_cycle_group"

      # ========================================================================
      # ШАГ 2: Проверка движения (если хоть одна едет → STOP всем)
      # ========================================================================
      - variables:
          any_moving: >-
            {% set ns = namespace(found=false) %}
            {% for device in devices %}
              {% if device.running == 'on' %}
                {% set ns.found = true %}
              {% endif %}
            {% endfor %}
            {{ ns.found }}

      - service: system_log.write
        data:
          message: "STEP 2: Проверка движения. any_moving={{ any_moving }}"
          level: info
          logger: "curtain_cycle_group"

      - choose:
          # Если хоть одно устройство движется → STOP всем
          - conditions:
              - condition: template
                value_template: "{{ any_moving }}"
            sequence:
              - repeat:
                  for_each: "{{ devices }}"
                  sequence:
                    - service: cover.stop_cover
                      target:
                        entity_id: "{{ repeat.item.cover }}"
                    - service: system_log.write
                      data:
                        message: "STOP: {{ repeat.item.cover }} (групповая остановка)"
                        level: info
                        logger: "curtain_cycle_group"
              
              - service: system_log.write
                data:
                  message: "END: STOP всем (обнаружено движение)"
                  level: info
                  logger: "curtain_cycle_group"
              - stop: "Остановка группы"

      # ========================================================================
      # ШАГ 3: Проверка защиты для каждого устройства
      # ========================================================================
      - variables:
          # Создаём список активных и заблокированных устройств
          active_devices: >-
            {% set ns = namespace(active=[], blocked=[]) %}
            {% for device in devices %}
              {% set prot = protections[device.index] %}
              {% set is_protected = prot is not none and prot != '' and is_state(prot, 'on') %}
              {% if is_protected %}
                {% set ns.blocked = ns.blocked + [device] %}
              {% else %}
                {% set ns.active = ns.active + [device] %}
              {% endif %}
            {% endfor %}
            {{ ns.active }}
          
          blocked_devices: >-
            {% set ns = namespace(blocked=[]) %}
            {% for device in devices %}
              {% set prot = protections[device.index] %}
              {% set is_protected = prot is not none and prot != '' and is_state(prot, 'on') %}
              {% if is_protected %}
                {% set ns.blocked = ns.blocked + [device] %}
              {% endif %}
            {% endfor %}
            {{ ns.blocked }}

      - service: system_log.write
        data:
          message: "STEP 3: Проверка защиты. Активных: {{ active_devices | length }}, Заблокированных: {{ blocked_devices | length }}"
          level: info
          logger: "curtain_cycle_group"

      - choose:
          # Если все устройства заблокированы → выходим
          - conditions:
              - condition: template
                value_template: "{{ active_devices | length == 0 }}"
            sequence:
              - service: system_log.write
                data:
                  message: "END: Все устройства заблокированы защитой"
                  level: warning
                  logger: "curtain_cycle_group"
              - stop: "Все устройства заблокированы"

      # ========================================================================
      # ШАГ 4: Определение направления группы
      # ========================================================================
      - variables:
          group_direction: >-
            {% set ns = namespace(
              all_closed=true,
              all_open=true,
              has_intermediate=false,
              intermediate_last_dir='unknown',
              closing_votes=0,
              opening_votes=0
            ) %}
            
            {# Проверяем все устройства (включая заблокированные) #}
            {% for device in devices %}
              {% if device.position > closed_threshold %}
                {% set ns.all_closed = false %}
              {% endif %}
              
              {% if device.position < open_threshold %}
                {% set ns.all_open = false %}
              {% endif %}
              
              {% if device.position > closed_threshold and device.position < open_threshold %}
                {% set ns.has_intermediate = true %}
                {% set ns.intermediate_last_dir = device.last_direction %}
              {% endif %}
              
              {% if device.last_direction == 'closing' %}
                {% set ns.closing_votes = ns.closing_votes + 1 %}
              {% elif device.last_direction == 'opening' %}
                {% set ns.opening_votes = ns.opening_votes + 1 %}
              {% endif %}
            {% endfor %}
            
            {# Определяем направление #}
            {% if ns.all_closed %}
              opening
            {% elif ns.all_open %}
              closing
            {% elif ns.has_intermediate %}
              {# Используем last_direction промежуточного устройства #}
              {% if ns.intermediate_last_dir == 'closing' %}
                opening
              {% elif ns.intermediate_last_dir == 'opening' %}
                closing
              {% else %}
                opening
              {% endif %}
            {% else %}
              {# Смешанное состояние (0 и 100 одновременно) → голосование #}
              {% if ns.closing_votes > ns.opening_votes %}
                opening
              {% elif ns.opening_votes > ns.closing_votes %}
                closing
              {% else %}
                {# Ничья → по умолчанию открываем #}
                opening
              {% endif %}
            {% endif %}

      - service: system_log.write
        data:
          message: "STEP 4: Направление группы: {{ group_direction }}"
          level: info
          logger: "curtain_cycle_group"

      # ========================================================================
      # ШАГ 5: Отправка команд активным устройствам
      # ========================================================================
      - repeat:
          for_each: "{{ active_devices }}"
          sequence:
            - choose:
                # Если direction == opening → открываем (если не на 100%)
                - conditions:
                    - condition: template
                      value_template: "{{ group_direction == 'opening' and repeat.item.position < 100 }}"
                  sequence:
                    - service: cover.set_cover_position
                      target:
                        entity_id: "{{ repeat.item.cover }}"
                      data:
                        position: 100
                    - service: system_log.write
                      data:
                        message: "OPEN: {{ repeat.item.cover }} (pos {{ repeat.item.position }} → 100)"
                        level: info
                        logger: "curtain_cycle_group"

                # Если direction == closing → закрываем (если не на 0%)
                - conditions:
                    - condition: template
                      value_template: "{{ group_direction == 'closing' and repeat.item.position > 0 }}"
                  sequence:
                    - service: cover.set_cover_position
                      target:
                        entity_id: "{{ repeat.item.cover }}"
                      data:
                        position: 0
                    - service: system_log.write
                      data:
                        message: "CLOSE: {{ repeat.item.cover }} (pos {{ repeat.item.position }} → 0)"
                        level: info
                        logger: "curtain_cycle_group"

                # Если устройство уже на целевой позиции → пропускаем
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ (group_direction == 'opening' and repeat.item.position >= 100)
                           or (group_direction == 'closing' and repeat.item.position <= 0) }}
                  sequence:
                    - service: system_log.write
                      data:
                        message: "SKIP: {{ repeat.item.cover }} (уже на позиции {{ repeat.item.position }})"
                        level: info
                        logger: "curtain_cycle_group"

      - service: system_log.write
        data:
          message: "END: Команды отправлены"
          level: info
          logger: "curtain_cycle_group"

  # ============================================================================
  # СКРИПТ ДЛЯ УСТАНОВКИ ПОЗИЦИЙ (СЦЕНЫ)
  # ============================================================================
  
  curtain_set_positions:
    alias: "(не вызывать) Универсальный скрипт установки позиций с защитой"
    fields:
      curtains:
        description: "Список словарей: {cover, position, protection}"
    sequence:
      - variables:
          closed_threshold: "{{ states('input_number.curtain_closed_threshold') | int(5) }}"
          open_threshold: "{{ states('input_number.curtain_open_threshold') | int(95) }}"

      - service: system_log.write
        data:
          message: "START: devices={{ curtains | length }}, thresholds={{ closed_threshold }}/{{ open_threshold }}"
          level: info
          logger: "curtain_set_positions"

      - repeat:
          for_each: "{{ curtains }}"
          sequence:
            - variables:
                is_protected: >-
                  {{ repeat.item.protection is defined 
                     and repeat.item.protection is not none 
                     and repeat.item.protection != '' 
                     and is_state(repeat.item.protection, 'on') }}

            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ not is_protected }}"
                  sequence:
                    - service: cover.set_cover_position
                      target: { entity_id: "{{ repeat.item.cover }}" }
                      data: { position: "{{ repeat.item.position }}" }

                    - service: system_log.write
                      data:
                        message: "SET: {{ repeat.item.cover }} -> {{ repeat.item.position }}%"
                        level: info
                        logger: "curtain_set_positions"

                - conditions:
                    - condition: template
                      value_template: "{{ is_protected }}"
                  sequence:
                    - service: system_log.write
                      data:
                        message: "BLOCKED: {{ repeat.item.cover }} (защита {{ repeat.item.protection }} активна)"
                        level: warning
                        logger: "curtain_set_positions"

      - service: system_log.write
        data:
          message: "END"
          level: info
          logger: "curtain_set_positions"

  # ============================================================================
  # КНОПКА 4 (ОДИНАРНОЕ НАЖАТИЕ): ОТКРЫТЬ ВСЁ ИЛИ СТОП
  # ============================================================================
  # Логика:
  # - Если хоть одно устройство движется → STOP всем (включая стоящие)
  # - Иначе → OPEN всем (position=100)
  # - Защита проверяется для каждого устройства отдельно
  # ============================================================================
  
  curtain_group_open_or_stop:
    alias: "(не вызывать) Группа: открыть всё или стоп (с защитой)"
    fields:
      target_covers:
        description: "Список cover entity_id"
        required: true
      running_sensors:
        description: "Список binary_sensor xxx_running"
        required: true
      protection_sensors:
        description: "Список датчиков защиты (null если нет защиты)"
        required: false
    sequence:
      # ========================================================================
      # ШАГ 1: Нормализация датчиков
      # ========================================================================
      - variables:
          devices: >-
            {% set ns = namespace(list=[]) %}
            {% for i in range(target_covers | length) %}
              {% set running_raw = states(running_sensors[i]) %}
              {% set running = 'off' if running_raw in ['unknown', 'unavailable', 'off'] else 'on' %}
              {% set ns.list = ns.list + [{
                'cover': target_covers[i],
                'running': running,
                'index': i
              }] %}
            {% endfor %}
            {{ ns.list }}
          
          protections: >-
            {% if protection_sensors is defined and protection_sensors is not none %}
              {{ protection_sensors }}
            {% else %}
              {% set ns = namespace(items=[]) %}
              {% for i in range(target_covers | length) %}
                {% set ns.items = ns.items + [none] %}
              {% endfor %}
              {{ ns.items }}
            {% endif %}
          
          any_moving: >-
            {% set ns = namespace(found=false) %}
            {% for device in devices %}
              {% if device.running == 'on' %}
                {% set ns.found = true %}
              {% endif %}
            {% endfor %}
            {{ ns.found }}

      - service: system_log.write
        data:
          message: "START: devices={{ devices | length }}, any_moving={{ any_moving }}"
          level: info
          logger: "curtain_group_open_or_stop"

      # ========================================================================
      # ШАГ 2: Если хоть одно движется → STOP всем
      # ========================================================================
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ any_moving }}"
            sequence:
              - repeat:
                  for_each: "{{ devices }}"
                  sequence:
                    - service: cover.stop_cover
                      target:
                        entity_id: "{{ repeat.item.cover }}"
                    - service: system_log.write
                      data:
                        message: "STOP: {{ repeat.item.cover }}"
                        level: info
                        logger: "curtain_group_open_or_stop"
              
              - service: system_log.write
                data:
                  message: "END: STOP всем (обнаружено движение)"
                  level: info
                  logger: "curtain_group_open_or_stop"

      # ========================================================================
      # ШАГ 3: Если ничего не движется → OPEN всем (с проверкой защиты)
      # ========================================================================
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ not any_moving }}"
            sequence:
              - repeat:
                  for_each: "{{ devices }}"
                  sequence:
                    - variables:
                        prot: "{{ protections[repeat.item.index] }}"
                        is_protected: "{{ prot is not none and prot != '' and is_state(prot, 'on') }}"
                    
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ not is_protected }}"
                          sequence:
                            - service: cover.set_cover_position
                              target:
                                entity_id: "{{ repeat.item.cover }}"
                              data:
                                position: 100
                            - service: system_log.write
                              data:
                                message: "OPEN: {{ repeat.item.cover }} -> 100%"
                                level: info
                                logger: "curtain_group_open_or_stop"

                        - conditions:
                            - condition: template
                              value_template: "{{ is_protected }}"
                          sequence:
                            - service: system_log.write
                              data:
                                message: "BLOCKED OPEN: {{ repeat.item.cover }} (защита {{ prot }} активна)"
                                level: warning
                                logger: "curtain_group_open_or_stop"

      - service: system_log.write
        data:
          message: "END"
          level: info
          logger: "curtain_group_open_or_stop"

  # ============================================================================
  # КНОПКА 4 (ДВУКРАТНОЕ НАЖАТИЕ): ЗАКРЫТЬ ВСЁ
  # ============================================================================
  # Логика:
  # - Всегда закрываем все устройства (position=0)
  # - Защита проверяется для каждого устройства отдельно
  # ============================================================================
  
  curtain_group_close:
    alias: "(не вызывать) Группа: закрыть всё (с защитой)"
    fields:
      target_covers:
        description: "Список cover entity_id"
        required: true
      protection_sensors:
        description: "Список датчиков защиты (null если нет защиты)"
        required: false
    sequence:
      # ========================================================================
      # ШАГ 1: Нормализация списка защит
      # ========================================================================
      - variables:
          protections: >-
            {% if protection_sensors is defined and protection_sensors is not none %}
              {{ protection_sensors }}
            {% else %}
              {% set ns = namespace(items=[]) %}
              {% for i in range(target_covers | length) %}
                {% set ns.items = ns.items + [none] %}
              {% endfor %}
              {{ ns.items }}
            {% endif %}

      - service: system_log.write
        data:
          message: "START: devices={{ target_covers | length }}"
          level: info
          logger: "curtain_group_close"

      # ========================================================================
      # ШАГ 2: Закрываем все устройства (с проверкой защиты)
      # ========================================================================
      - repeat:
          for_each: "{{ range(target_covers | length) | list }}"
          sequence:
            - variables:
                idx: "{{ repeat.item }}"
                prot: "{{ protections[repeat.item] }}"
                is_protected: "{{ prot is not none and prot != '' and is_state(prot, 'on') }}"
            
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ not is_protected }}"
                  sequence:
                    - service: cover.set_cover_position
                      target:
                        entity_id: "{{ target_covers[idx] }}"
                      data:
                        position: 0
                    - service: system_log.write
                      data:
                        message: "CLOSE: {{ target_covers[idx] }} -> 0%"
                        level: info
                        logger: "curtain_group_close"

                - conditions:
                    - condition: template
                      value_template: "{{ is_protected }}"
                  sequence:
                    - service: system_log.write
                      data:
                        message: "BLOCKED CLOSE: {{ target_covers[idx] }} (защита {{ prot }} активна)"
                        level: warning
                        logger: "curtain_group_close"

      - service: system_log.write
        data:
          message: "END"
          level: info
          logger: "curtain_group_close"